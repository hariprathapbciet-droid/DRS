<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DRS - Diabetic Retinopathy Screening</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #ffffff 0%,
                #f8fcfe 45%,
                #eaf8ff 100%
            );

            color: #153247;
            font-size: 13px;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navbar {
            position: absolute;

            top: 28px;
            right: 100px;

            width: 330px;
            height: 58px;

            background: linear-gradient(
                135deg,
                #129ddd,
                #32afe0
            );

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: space-evenly;

            box-shadow:
                0 10px 25px rgba(23, 157, 218, 0.16);
        }

        .navbar a {
            color: #ffffff;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;
        }

        .navbar a:hover {
            opacity: 0.85;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            width: 100%;

            padding-top: 140px;
            padding-left: 110px;

            display: flex;
            align-items: center;
        }


        /* =====================================================
           ORIGINAL EYE LOGO
        ===================================================== */

        .logo-box {
            width: 210px;
            height: 180px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;

            border: none;
        }

        .logo-image {
            width: 170px;
            height: auto;

            display: block;

            object-fit: contain;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {
            margin-left: 40px;
            margin-top: 5px;
        }


        /* =====================================================
           DRS
        ===================================================== */

        .brand-name {
            font-size: 76px;

            line-height: 0.95;

            font-weight: 700;

            letter-spacing: -3px;

            color: #139fdc;
        }


        /* =====================================================
           SUBTITLE
        ===================================================== */

        .brand-subtitle {
            margin-top: 12px;

            font-size: 18px;

            letter-spacing: 1.2px;

            color: #66839a;

            font-weight: 400;
        }


        /* =====================================================
           PATIENT PROFILE
        ===================================================== */

        .profile-container {
            width: calc(100% - 390px);

            margin-left: 207px;
            margin-top: 55px;

            background: #ffffff;

            border: 1px solid #cce9f6;

            border-radius: 28px 28px 0 0;

            overflow: hidden;

            box-shadow:
                0 15px 40px rgba(36, 155, 205, 0.10);
        }


        /* =====================================================
           PROFILE HEADER
        ===================================================== */

        .profile-header {
            height: 105px;

            background: linear-gradient(
                135deg,
                #139ddd,
                #35b1df
            );

            display: flex;
            align-items: center;

            padding-left: 48px;

            color: #ffffff;
        }

        .profile-header h1 {
            font-size: 30px;

            font-weight: 600;
        }


        /* =====================================================
           FORM AREA
        ===================================================== */

        .form-area {
            padding: 45px;
        }

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            column-gap: 28px;
            row-gap: 28px;
        }


        /* =====================================================
           FORM BOX
        ===================================================== */

        .form-group {
            height: 120px;

            border: 1px solid #d2e8f2;

            border-radius: 18px;

            background: #fbfdfe;

            padding: 23px 27px;

            transition: 0.2s ease;
        }

        .form-group:hover {
            border-color: #39aee0;

            box-shadow:
                0 5px 15px rgba(27, 161, 218, 0.07);
        }


        /* =====================================================
           LABEL
        ===================================================== */

        .form-group label {
            display: block;

            color: #66859d;

            font-size: 14px;

            letter-spacing: 0.8px;

            margin-bottom: 8px;
        }


        /* =====================================================
           INPUTS
        ===================================================== */

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-size: 15px;

            color: #153247;

            font-family: Arial, Helvetica, sans-serif;
        }

        .form-group textarea {
            resize: none;
        }


        /* =====================================================
           FULL WIDTH ADDRESS
        ===================================================== */

        .full-width {
            grid-column: 1 / 3;

            height: 120px;
        }


        /* =====================================================
           GO TO UPLOAD BUTTON
        ===================================================== */

        .button-container {
            margin-top: 28px;

            display: flex;

            justify-content: flex-end;
        }

        .upload-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 155px;

            padding: 13px 25px;

            background: linear-gradient(
                135deg,
                #129ddd,
                #31afe0
            );

            color: #ffffff;

            text-decoration: none;

            border-radius: 11px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(20, 157, 220, 0.16);

            transition: 0.2s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(20, 157, 220, 0.22);
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1100px) {

            .navbar {
                right: 30px;
            }

            .header {
                padding-left: 50px;
            }

            .profile-container {
                width: calc(100% - 100px);

                margin-left: 50px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .navbar {
                position: relative;

                top: auto;
                right: auto;

                margin: 20px auto;

                width: 280px;
            }

            .header {
                padding-top: 30px;
                padding-left: 30px;

                flex-direction: column;

                align-items: flex-start;
            }

            .logo-box {
                width: 190px;
                height: 165px;
            }

            .logo-image {
                width: 155px;
            }

            .brand {
                margin-left: 0;

                margin-top: 18px;
            }

            .brand-name {
                font-size: 62px;
            }

            .brand-subtitle {
                font-size: 16px;
            }

            .profile-container {
                width: calc(100% - 40px);

                margin-left: 20px;

                margin-top: 35px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .header {
                padding-left: 20px;
            }

            .logo-box {
                width: 170px;
                height: 150px;
            }

            .logo-image {
                width: 140px;
            }

            .brand-name {
                font-size: 55px;
            }

            .brand-subtitle {
                font-size: 14px;

                letter-spacing: 0.8px;
            }

            .profile-container {
                width: calc(100% - 20px);

                margin-left: 10px;
            }

            .profile-header {
                padding-left: 25px;
            }

            .profile-header h1 {
                font-size: 25px;
            }

            .form-area {
                padding: 22px;
            }

            .upload-btn {
                width: 100%;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         NAVIGATION
    ===================================================== -->

    <nav class="navbar">

        <a href="home.html">
            Home
        </a>

        <a href="contact.html">
            Contact & Help
        </a>

    </nav>



    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="header">

        <!-- ORIGINAL EYE LOGO -->

        <div class="logo-box">

            <img
                src="logo5.jpeg"
                alt="DRS Eye Logo"
                class="logo-image"
            >

        </div>


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-name">
                DRS
            </div>

            <div class="brand-subtitle">
                Diabetic Retinopathy Screening
            </div>

        </div>

    

    </header>



    <!-- =====================================================
         PATIENT PROFILE
    ===================================================== -->

    <main class="profile-container">


        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <h1>
                Patient Profile
            </h1>

        </div>



        <!-- FORM -->

        <div class="form-area">

            <div class="form-grid">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullname">
                        FULL NAME
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                    >

                </div>



                <!-- AGE -->

                <div class="form-group">

                    <label for="age">
                        AGE
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="1"
                        max="120"
                    >

                </div>



                <!-- GENDER -->

                <div class="form-group">

                    <label for="gender">
                        GENDER
                    </label>

                    <select
                        id="gender"
                        name="gender"
                    >

                        <option value=""></option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- PHONE NUMBER -->

                <div class="form-group">

                    <label for="phone">
                        PHONE NUMBER
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                    >

                </div>



                <!-- ADDRESS -->

                <div class="form-group full-width">

                    <label for="address">
                        ADDRESS
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="2"
                    ></textarea>

                </div>


            </div>



            <!-- GO TO UPLOAD -->

            <div class="button-container">

                <a
                    href="upload.html"
                    class="upload-btn"
                >
                    Go to Upload
                </a>

            </div>

        </div>

    </main>


</body>
</html>
